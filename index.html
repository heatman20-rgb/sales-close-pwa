<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>마감보고</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#111827}
.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px #0001}
h1{font-size:24px;margin:4px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:#4b5563;display:block;margin-bottom:6px}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:800;background:#111827;color:#fff;margin-top:12px}
.secondary{background:#e5e7eb;color:#111827}.result{white-space:pre-wrap;font-size:16px;line-height:1.75;font-weight:600}
</style></head><body><div class="wrap"><h1>📋 마감보고</h1>
<div class="card"><div class="grid">
<div><label>점포</label><input id="store" value="강남점"></div>
<div><label>날짜</label><input id="date" type="date"></div>
<div><label>당일매출</label><input id="sales" inputmode="numeric"></div>
<div><label>전년 동요일 매출</label><input id="last" inputmode="numeric"></div>
<div><label>목표매출</label><input id="target" inputmode="numeric"></div>
<div><label>배달 매출</label><input id="delivery" inputmode="numeric" value="0"></div>
<div><label>델리 매출</label><input id="deli" inputmode="numeric"></div>
<div><label>당일 기부금액</label><input id="donation" inputmode="numeric" value="0"></div>
<div><label>당월 기존 누적매출</label><input id="cum" inputmode="numeric"></div>
</div><button onclick="makeReport()">계산 / 보고서 만들기</button></div>
<div class="card"><div id="out" class="result">입력 후 버튼을 눌러주세요.</div>
<button class="secondary" onclick="copyReport()">📋 보고서 복사</button></div></div>
<script>
const $=id=>document.getElementById(id), n=id=>Number($(id).value.replaceAll(',',''))||0;
const won=x=>Math.round(x).toLocaleString('ko-KR')+'원';
const pct=x=>(Math.round(x*10)/10).toFixed(1)+'%';
function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('date').value=d.toISOString().slice(0,10)}
function makeReport(){
let s=n('sales'),l=n('last'),t=n('target'),d=n('delivery'),de=n('deli'),don=n('donation'),c=n('cum');
let a=t?s/t*100:0,g=l?(s/l-1)*100:0,total=c+s;
let [y,m,day]=$('date').value.split('-');
let r=`${$('store').value||'강남점'} ${+m}월 ${+day}일 마감보고 드립니다.
■당일매출 : ${won(s)}
■목표달성률 : ${pct(a)}
■전년비성장률 : ${pct(g)}

■당일 배달 매출 : ${d?won(d):'-'}
■당일 기부 금액 : ${don?won(don):'-'}
■당일 델리 매출 : ${won(de)}

■당월 누적매출 : ${won(total)}`;
$('out').textContent=r;
}
async function copyReport(){try{await navigator.clipboard.writeText($('out').textContent);alert('복사되었습니다.')}catch(e){alert('보고서를 길게 눌러 복사해주세요.')}}
today();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
